<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Page metadata and shared stylesheet link -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basket | Jermaine Fotography</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Main wrapper containing header, basket content, and footer -->
  <div class="page">
    <!-- Header section with brand logo -->
    <header class="header">
      <!-- Dedicated top-right basket section -->
      <section class="header-basket" aria-label="Basket quick link">
        <a class="basket-link" href="basket.html" aria-label="Open basket page">
          <img class="basket-icon" src="images/basket.png" alt="Basket"> <!-- Icon by https://icons8.com/  -->
        </a>
      </section>

      <!-- Clickable logo that always redirects to the home page -->
      <a class="header-logo-link" href="index.html">
        <img class="header-logo" src="images/logo.png" alt="Jermaine Fotography logo"> <!-- Logo generated with https://logo.com/  -->
      </a>

      <!-- Mobile menu button with three-line icon -->
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle navigation menu">
        <span class="menu-toggle-line"></span>
        <span class="menu-toggle-line"></span>
        <span class="menu-toggle-line"></span>
      </button>

      <!-- Main navigation using an unordered list -->
      <nav class="main-nav" id="primary-nav" aria-label="Primary navigation">
        <!-- Close button shown at top-right of the opened mobile menu -->
        <button class="menu-close" type="button" aria-label="Close navigation menu">
          X
        </button>

        <ul class="main-nav-list">
          <!-- Portfolio item using a native details/summary click dropdown -->
          <li class="main-nav-item">
            <details class="dropdown">
              <summary class="dropdown-summary">
                <span class="main-nav-link">Portfolio</span>
                <span class="dropdown-arrow" aria-hidden="true">▾</span>
              </summary>

              <ul class="dropdown-menu">
                <li><a class="dropdown-link" href="landscape.html">Landscape</a></li>
                <li><a class="dropdown-link" href="still-life.html">Still life</a></li>
              </ul>
            </details>
          </li>

          <!-- Standard navigation items -->
          <li class="main-nav-item"><a class="main-nav-link" href="about.html">About</a></li>
          <li class="main-nav-item"><a class="main-nav-link" href="purchase-prints.html">Purchase prints</a></li>
        </ul>

        <!-- Social icons shown inside the mobile full-screen menu -->
        <ul class="mobile-menu-social" aria-label="Mobile social links">
          <li>
            <a class="mobile-menu-icon-link" href="#" aria-label="Instagram">
              <img class="mobile-menu-icon" src="images/instagram.png" alt="Instagram"> <!-- Icon by https://icons8.com/  -->
            </a>
          </li>
          <li>
            <a class="mobile-menu-icon-link" href="#" aria-label="Facebook">
              <img class="mobile-menu-icon" src="images/facebook.png" alt="Facebook"> <!-- Icon by https://icons8.com/  -->
            </a>
          </li>
          <li>
            <a class="mobile-menu-icon-link" href="#" aria-label="Email">
              <img class="mobile-menu-icon" src="images/email.png" alt="Email"> <!-- Icon by https://icons8.com/  -->
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- Basket content area -->
    <main class="cart-main">
      <section class="cart-section" aria-label="Basket items">
        <!-- Basket page heading and return link -->
        <header class="cart-header">
          <h1 class="cart-title">Your cart</h1>
          <a class="cart-continue-link" href="purchase-prints.html">Continue shopping</a>
        </header>

        <!-- Empty-cart message shown when no items exist -->
        <div class="cart-empty" id="cart-empty" hidden>
          <p class="cart-empty-text">Your cart is currently empty.</p>
          <a class="cart-empty-link" href="purchase-prints.html">Browse prints</a>
        </div>

        <!-- Main cart content with line items and subtotal -->
        <div class="cart-content" id="cart-content" hidden>
          <div class="cart-table-wrap">
            <table class="cart-table">
              <thead>
                <tr>
                  <th scope="col">Product</th>
                  <th scope="col">Price</th>
                  <th scope="col">Quantity</th>
                  <th scope="col">Total</th>
                  <th scope="col"></th>
                </tr>
              </thead>
              <tbody id="cart-items-body"></tbody>
            </table>
          </div>

          <!-- Basket subtotal and checkout action -->
          <aside class="cart-summary" aria-label="Basket summary">
            <h2 class="cart-summary-title">Subtotal</h2>
            <p class="cart-subtotal" id="cart-subtotal">£0.00</p>
            <p class="cart-summary-note">Taxes and shipping calculated at checkout.</p>
            <button class="cart-checkout-button" type="button">Checkout</button>
          </aside>
        </div>
      </section>
    </main>

    <!-- Footer section -->
    <footer class="footer">
      <!-- Footer social navigation icons -->
      <nav class="footer-nav" aria-label="Footer social navigation">
        <ul class="footer-nav-list">
          <li>
            <a class="footer-icon-link" href="#" aria-label="Instagram">
              <img class="footer-icon" src="images/instagram.png" alt="Instagram"> <!-- Icon by https://icons8.com/  -->
            </a>
          </li>
          <li>
            <a class="footer-icon-link" href="#" aria-label="Facebook">
              <img class="footer-icon" src="images/facebook.png" alt="Facebook"> <!-- Icon by https://icons8.com/  -->
            </a>
          </li>
          <li>
            <a class="footer-icon-link" href="#" aria-label="Email">
              <img class="footer-icon" src="images/email.png" alt="Email"> <!-- Icon by https://icons8.com/  -->
            </a>
          </li>

          <!-- Copyright text displayed next to the footer icons -->
          <li class="footer-copy-item">
            <span class="footer-copyright">© 2026 Jermaine Fotography</span>
          </li>
        </ul>
      </nav>
    </footer>
  </div>

  <!-- Shared cart utility script for basket persistence -->
  <script src="inc/cart.js"></script>
  <script src="inc/cart-ui.js"></script>

  <!-- JS scripts for mobile navigation and basket interactions -->
  <script>
    /* Mobile navigation menu controls */
    const menuToggleButton = document.querySelector(".menu-toggle");
    const menuCloseButton = document.querySelector(".menu-close");
    const primaryNavigation = document.getElementById("primary-nav");

    if (menuToggleButton && primaryNavigation) {
      function setMenuState(isOpen) {
        primaryNavigation.classList.toggle("is-open", isOpen);
        menuToggleButton.setAttribute("aria-expanded", String(isOpen));
        document.body.classList.toggle("menu-open", isOpen);
      }

      menuToggleButton.addEventListener("click", function () {
        const isOpen = !primaryNavigation.classList.contains("is-open");
        setMenuState(isOpen);
      });

      if (menuCloseButton) {
        menuCloseButton.addEventListener("click", function () {
          setMenuState(false);
        });
      }

      primaryNavigation.querySelectorAll("a").forEach(function (link) {
        link.addEventListener("click", function () {
          if (window.innerWidth <= 768) {
            setMenuState(false);
          }
        });
      });

      window.addEventListener("resize", function () {
        if (window.innerWidth > 768) {
          setMenuState(false);
        }
      });
    }

    /* Basket rendering and interaction controls */
    const cartEmptyState = document.getElementById("cart-empty");
    const cartContent = document.getElementById("cart-content");
    const cartItemsBody = document.getElementById("cart-items-body");
    const cartSubtotalValue = document.getElementById("cart-subtotal");

    /* Resolve a product detail page URL from the cart item identifier */
    function getProductPageLink(productId) {
      if (productId.startsWith("turquoise-alpine-lake")) {
        return "product-turquoise-alpine-lake.html";
      }

      if (productId.startsWith("sunflowers-and-lemons")) {
        return "product-sunflowers-and-lemons.html";
      }

      if (productId.startsWith("rolling-green-hills")) {
        return "product-rolling-green-hills.html";
      }

      if (productId.startsWith("two-pears-in-sunlight")) {
        return "product-two-pears-in-sunlight.html";
      }

      if (productId.startsWith("lemon-grove-still-life")) {
        return "product-lemon-grove-still-life.html";
      }

      return "purchase-prints.html";
    }

    /* Build one cart table row for a single product line item */
    function createCartRow(item) {
      const row = document.createElement("tr");
      row.className = "cart-row";
      row.dataset.productId = item.id;

      const productCell = document.createElement("td");
      productCell.className = "cart-product-cell";

      const productImageLink = document.createElement("a");
      productImageLink.className = "cart-product-image-link";
      productImageLink.href = getProductPageLink(item.id);

      const productImage = document.createElement("img");
      productImage.className = "cart-product-image";
      productImage.src = item.image;
      productImage.alt = item.name + " thumbnail";
      productImageLink.appendChild(productImage);

      const productInfo = document.createElement("div");
      productInfo.className = "cart-product-info";

      const productName = document.createElement("h2");
      productName.className = "cart-product-name";
      productName.textContent = item.name;

      const productType = document.createElement("p");
      productType.className = "cart-product-meta";
      productType.textContent = item.type;

      const productDate = document.createElement("p");
      productDate.className = "cart-product-meta";
      productDate.textContent = "Published: " + item.publishedDate;

      productInfo.appendChild(productName);
      productInfo.appendChild(productType);
      productInfo.appendChild(productDate);
      productCell.appendChild(productImageLink);
      productCell.appendChild(productInfo);

      const priceCell = document.createElement("td");
      priceCell.className = "cart-price-cell";
      priceCell.textContent = window.JermaineCart.formatCurrency(item.price);

      const quantityCell = document.createElement("td");
      quantityCell.className = "cart-quantity-cell";

      const quantityControl = document.createElement("div");
      quantityControl.className = "cart-quantity-control";
      quantityControl.setAttribute("role", "group");
      quantityControl.setAttribute("aria-label", "Quantity selector for " + item.name);

      const decreaseButton = document.createElement("button");
      decreaseButton.className = "cart-qty-button cart-qty-decrease";
      decreaseButton.type = "button";
      decreaseButton.setAttribute("aria-label", "Decrease quantity for " + item.name);
      decreaseButton.textContent = "-";

      const quantityInput = document.createElement("input");
      quantityInput.className = "cart-qty-input";
      quantityInput.type = "number";
      quantityInput.min = "1";
      quantityInput.value = String(item.quantity);
      quantityInput.inputMode = "numeric";
      quantityInput.setAttribute("aria-label", "Quantity for " + item.name);

      const increaseButton = document.createElement("button");
      increaseButton.className = "cart-qty-button cart-qty-increase";
      increaseButton.type = "button";
      increaseButton.setAttribute("aria-label", "Increase quantity for " + item.name);
      increaseButton.textContent = "+";

      quantityControl.appendChild(decreaseButton);
      quantityControl.appendChild(quantityInput);
      quantityControl.appendChild(increaseButton);
      quantityCell.appendChild(quantityControl);

      const totalCell = document.createElement("td");
      totalCell.className = "cart-total-cell";
      totalCell.textContent = window.JermaineCart.formatCurrency(item.price * item.quantity);

      const removeCell = document.createElement("td");
      removeCell.className = "cart-remove-cell";

      const removeButton = document.createElement("button");
      removeButton.className = "cart-remove-button";
      removeButton.type = "button";
      removeButton.textContent = "Remove";
      removeButton.setAttribute("aria-label", "Remove " + item.name + " from cart");

      removeCell.appendChild(removeButton);

      row.appendChild(productCell);
      row.appendChild(priceCell);
      row.appendChild(quantityCell);
      row.appendChild(totalCell);
      row.appendChild(removeCell);

      return row;
    }

    /* Render the cart table and subtotal from local storage state */
    function renderCart() {
      if (!window.JermaineCart) {
        return;
      }

      const cartItems = window.JermaineCart.readCart();
      cartItemsBody.innerHTML = "";

      if (cartItems.length === 0) {
        cartContent.hidden = true;
        cartEmptyState.hidden = false;
        cartSubtotalValue.textContent = window.JermaineCart.formatCurrency(0);
        return;
      }

      cartItems.forEach(function (item) {
        cartItemsBody.appendChild(createCartRow(item));
      });

      cartSubtotalValue.textContent = window.JermaineCart.formatCurrency(
        window.JermaineCart.calculateSubtotal(cartItems)
      );
      cartEmptyState.hidden = true;
      cartContent.hidden = false;
    }

    /* Cart quantity and remove controls using table event delegation */
    cartItemsBody.addEventListener("click", function (event) {
      if (!window.JermaineCart) {
        return;
      }

      const targetRow = event.target.closest(".cart-row");
      if (!targetRow) {
        return;
      }

      const productId = targetRow.dataset.productId;
      const quantityInput = targetRow.querySelector(".cart-qty-input");
      const currentQuantity = Number.parseInt(quantityInput.value, 10) || 1;

      if (event.target.classList.contains("cart-qty-increase")) {
        window.JermaineCart.updateItemQuantity(productId, currentQuantity + 1);
        renderCart();
        return;
      }

      if (event.target.classList.contains("cart-qty-decrease")) {
        window.JermaineCart.updateItemQuantity(productId, Math.max(1, currentQuantity - 1));
        renderCart();
        return;
      }

      if (event.target.classList.contains("cart-remove-button")) {
        window.JermaineCart.removeItem(productId);
        renderCart();
      }
    });

    /* Manual quantity field edits in the basket table */
    cartItemsBody.addEventListener("change", function (event) {
      if (!window.JermaineCart || !event.target.classList.contains("cart-qty-input")) {
        return;
      }

      const targetRow = event.target.closest(".cart-row");
      if (!targetRow) {
        return;
      }

      const productId = targetRow.dataset.productId;
      const nextQuantity = Number.parseInt(event.target.value, 10);
      const safeQuantity = Number.isFinite(nextQuantity) && nextQuantity > 0 ? nextQuantity : 1;

      window.JermaineCart.updateItemQuantity(productId, safeQuantity);
      renderCart();
    });

    renderCart();
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Page metadata and shared stylesheet link -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Basket | Jermaine Fotography</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <!-- Main wrapper containing header, basket content, and footer -->
  <div class="page">
    <!-- Header section with brand logo -->
    <header class="header">
      <!-- Dedicated top-right basket section -->
      <section class="header-basket" aria-label="Basket quick link">
        <a class="basket-link" href="basket.html" aria-label="Open basket page">
          <img class="basket-icon" src="images/basket.png" alt="Basket"> <!-- Icon by https://icons8.com/  -->
        </a>
      </section>

      <!-- Clickable logo that always redirects to the home page -->
      <a class="header-logo-link" href="index.html">
        <img class="header-logo" src="images/logo.png" alt="Jermaine Fotography logo"> <!-- Logo generated with https://logo.com/  -->
      </a>

      <!-- Mobile menu button with three-line icon -->
      <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="primary-nav" aria-label="Toggle navigation menu">
        <span class="menu-toggle-line"></span>
        <span class="menu-toggle-line"></span>
        <span class="menu-toggle-line"></span>
      </button>

      <!-- Main navigation using an unordered list -->
      <nav class="main-nav" id="primary-nav" aria-label="Primary navigation">
        <!-- Close button shown at top-right of the opened mobile menu -->
        <button class="menu-close" type="button" aria-label="Close navigation menu">
          X
        </button>

        <ul class="main-nav-list">
          <!-- Portfolio item using a native details/summary click dropdown -->
          <li class="main-nav-item">
            <details class="dropdown">
              <summary class="dropdown-summary">
                <span class="main-nav-link">Portfolio</span>
                <span class="dropdown-arrow" aria-hidden="true">▾</span>
              </summary>

              <ul class="dropdown-menu">
                <li><a class="dropdown-link" href="landscape.html">Landscape</a></li>
                <li><a class="dropdown-link" href="still-life.html">Still life</a></li>
              </ul>
            </details>
          </li>

          <!-- Standard navigation items -->
          <li class="main-nav-item"><a class="main-nav-link" href="about.html">About</a></li>
          <li class="main-nav-item"><a class="main-nav-link" href="purchase-prints.html">Purchase prints</a></li>
        </ul>

        <!-- Social icons shown inside the mobile full-screen menu -->
        <ul class="mobile-menu-social" aria-label="Mobile social links">
          <li>
            <a class="mobile-menu-icon-link" href="#" aria-label="Instagram">
              <img class="mobile-menu-icon" src="images/instagram.png" alt="Instagram"> <!-- Icon by https://icons8.com/  -->
            </a>
          </li>
          <li>
            <a class="mobile-menu-icon-link" href="#" aria-label="Facebook">
              <img class="mobile-menu-icon" src="images/facebook.png" alt="Facebook"> <!-- Icon by https://icons8.com/  -->
            </a>
          </li>
          <li>
            <a class="mobile-menu-icon-link" href="#" aria-label="Email">
              <img class="mobile-menu-icon" src="images/email.png" alt="Email"> <!-- Icon by https://icons8.com/  -->
            </a>
          </li>
        </ul>
      </nav>
    </header>

    <!-- Basket content area -->
    <main class="cart-main">
      <section class="cart-section" aria-label="Basket items">
        <!-- Basket page heading and return link -->
        <header class="cart-header">
          <h1 class="cart-title">Your cart</h1>
          <a class="cart-continue-link" href="purchase-prints.html">Continue shopping</a>
        </header>

        <!-- Empty-cart message shown when no items exist -->
        <div class="cart-empty" id="cart-empty" hidden>
          <p class="cart-empty-text">Your cart is currently empty.</p>
          <a class="cart-empty-link" href="purchase-prints.html">Browse prints</a>
        </div>

        <!-- Main cart content with line items and subtotal -->
        <div class="cart-content" id="cart-content" hidden>
          <div class="cart-table-wrap">
            <table class="cart-table">
              <thead>
                <tr>
                  <th scope="col">Product</th>
                  <th scope="col">Price</th>
                  <th scope="col">Quantity</th>
                  <th scope="col">Total</th>
                  <th scope="col"></th>
                </tr>
              </thead>
              <tbody id="cart-items-body"></tbody>
            </table>
          </div>

          <!-- Basket subtotal and checkout action -->
          <aside class="cart-summary" aria-label="Basket summary">
            <h2 class="cart-summary-title">Subtotal</h2>
            <p class="cart-subtotal" id="cart-subtotal">£0.00</p>
            <p class="cart-summary-note">Taxes and shipping calculated at checkout.</p>
            <button class="cart-checkout-button" type="button">Checkout</button>
          </aside>
        </div>
      </section>
    </main>

    <!-- Footer section -->
    <footer class="footer">
      <!-- Footer social navigation icons -->
      <nav class="footer-nav" aria-label="Footer social navigation">
        <ul class="footer-nav-list">
          <li>
            <a class="footer-icon-link" href="#" aria-label="Instagram">
              <img class="footer-icon" src="images/instagram.png" alt="Instagram"> <!-- Icon by https://icons8.com/  -->
            </a>
          </li>
          <li>
            <a class="footer-icon-link" href="#" aria-label="Facebook">
              <img class="footer-icon" src="images/facebook.png" alt="Facebook"> <!-- Icon by https://icons8.com/  -->
            </a>
          </li>
          <li>
            <a class="footer-icon-link" href="#" aria-label="Email">
              <img class="footer-icon" src="images/email.png" alt="Email"> <!-- Icon by https://icons8.com/  -->
            </a>
          </li>

          <!-- Copyright text displayed next to the footer icons -->
          <li class="footer-copy-item">
            <span class="footer-copyright">© 2026 Jermaine Fotography</span>
          </li>
        </ul>
      </nav>
    </footer>
  </div>

  <!-- Shared scripts for basket state, badge UI, mobile navigation, and basket interactions -->
  <script src="inc/cart.js"></script>
  <script src="inc/cart-ui.js"></script>
  <script src="inc/site-nav.js"></script>
  <script src="inc/basket-page.js"></script>
</body>
</html>
